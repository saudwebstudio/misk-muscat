<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misk Muscat | مسك مسقط</title>
<style>
:root{--bg:#1c1214;--card:#261a1d;--gold:#c9a25a;--text:#f3ead8;--muted:#b9a98c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif;line-height:1.6}
body.ar{direction:rtl;font-family:Tahoma,Arial,sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:1050px;margin:0 auto;padding:0 20px}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid #3a2a2d}
.brand{display:flex;align-items:center;gap:12px;font-size:20px;letter-spacing:3px;color:var(--gold)}
.brand img{width:46px;height:46px;border-radius:50%}
.lang{background:none;border:1px solid var(--gold);color:var(--gold);padding:7px 16px;border-radius:20px;cursor:pointer;font-size:14px}
.hero{text-align:center;padding:70px 0 60px}
.hero img{width:170px;height:170px;border-radius:50%;margin-bottom:24px;box-shadow:0 0 40px rgba(201,162,90,.25)}
.hero h1{font-size:40px;color:var(--gold);letter-spacing:2px;margin-bottom:10px}
.hero p{color:var(--muted);font-size:18px;max-width:560px;margin:0 auto 30px}
.btn{display:inline-block;background:var(--gold);color:#1c1214;padding:14px 30px;border-radius:30px;font-weight:bold;font-size:16px;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(201,162,90,.35)}
.btn.small{padding:10px 20px;font-size:14px;width:100%;text-align:center}
section{padding:50px 0}
h2{text-align:center;color:var(--gold);font-size:30px;margin-bottom:34px;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.card{background:var(--card);border:1px solid #3a2a2d;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1;object-fit:cover}
.card .body{padding:20px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:21px}
.card .desc{color:var(--muted);font-size:15px;flex:1}
.price{color:var(--gold);font-size:20px;font-weight:bold;margin-bottom:8px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.info>div{background:var(--card);border:1px solid #3a2a2d;border-radius:16px;padding:26px;text-align:center}
.info .ic{font-size:30px;margin-bottom:8px}
.info h4{color:var(--gold);margin-bottom:6px;font-size:18px}
.info p{color:var(--muted);font-size:15px}
footer{text-align:center;padding:40px 0;border-top:1px solid #3a2a2d;color:var(--muted);font-size:14px}
.float{position:fixed;bottom:22px;right:22px;width:60px;height:60px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.4);font-size:30px;z-index:9}
body.ar .float{right:auto;left:22px}
@media(max-width:600px){.hero h1{font-size:30px}.hero{padding:50px 0 40px}}

html{scroll-behavior:smooth}
nav{position:sticky;top:0;z-index:20;background:rgba(28,18,20,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.hero{position:relative;overflow:hidden;min-height:88vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
#sparkles{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.hero>*:not(canvas){position:relative;z-index:1}
.hero img{animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.shine{background:linear-gradient(90deg,#a07a35,#f6dfa4,#c9a25a,#f6dfa4,#a07a35);background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:300% center}}
.hero .intro{opacity:0;transform:translateY(25px);animation:up 1s forwards}
.hero .d1{animation-delay:.2s}.hero .d2{animation-delay:.45s}.hero .d3{animation-delay:.7s}.hero .d4{animation-delay:.95s}
@keyframes up{to{opacity:1;transform:none}}
.scroll{margin-top:40px;color:var(--muted);font-size:13px;letter-spacing:3px;animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
.reveal{opacity:0;transform:translateY(40px);transition:opacity .9s ease,transform .9s ease}
.reveal.show{opacity:1;transform:none}
.card{position:relative;transition:transform .35s ease,box-shadow .35s ease,border-color .35s}
.card:hover{transform:translateY(-8px);box-shadow:0 18px 40px rgba(0,0,0,.5),0 0 25px rgba(201,162,90,.2);border-color:var(--gold)}
.card .imgbox{overflow:hidden}
.card img{transition:transform .6s ease}
.card:hover img{transform:scale(1.08)}
.badge{position:absolute;top:14px;left:14px;z-index:2;background:var(--gold);color:#1c1214;font-size:12px;font-weight:bold;padding:5px 12px;border-radius:20px;letter-spacing:1px}
body.ar .badge{left:auto;right:14px}
.filters{display:flex;justify-content:center;gap:10px;margin:-14px 0 30px;flex-wrap:wrap}
.filters button{background:none;border:1px solid #4a3a3d;color:var(--muted);padding:8px 18px;border-radius:20px;cursor:pointer;font-size:14px;transition:.25s}
.filters button.on,.filters button:hover{border-color:var(--gold);color:#1c1214;background:var(--gold)}
.reviews{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.review{background:var(--card);border:1px solid #3a2a2d;border-radius:16px;padding:26px}
.review .stars{color:var(--gold);letter-spacing:3px;margin-bottom:10px}
.review p{color:var(--text);font-style:italic;margin-bottom:12px}
.review span{color:var(--muted);font-size:14px}
.cta{background:linear-gradient(135deg,#2c1d20,#3a2618);border:1px solid #4a3a2d;border-radius:24px;padding:50px 20px}
.float{animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.6)}70%{box-shadow:0 0 0 18px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
</style>
</head>

const cv=document.getElementById("sparkles"),cx=cv.getContext("2d");let pts=[];
function size(){cv.width=cv.offsetWidth;cv.height=cv.offsetHeight;pts=Array.from({length:70},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*2+.4,s:Math.random()*.4+.1,a:Math.random()}))}
function draw(){cx.clearRect(0,0,cv.width,cv.height);pts.forEach(p=>{p.y-=p.s;p.a+=.02;if(p.y<-5){p.y=cv.height+5;p.x=Math.random()*cv.width}cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fillStyle=`rgba(230,196,120,${.25+.35*Math.abs(Math.sin(p.a))})`;cx.fill()});requestAnimationFrame(draw)}
window.addEventListener("resize",size);size();draw();
</script>
</body>
</html>
